<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Opinion Survey</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>2027 Public Opinion Survey</h2>
    <form id="surveyForm">
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="state">State of Residence:</label>
            <input type="text" id="state" name="state" required>
        </div>

        <div class="form-group">
            <label for="priority">Primary Issue Concern:</label>
            <select id="priority" name="priority" required>
                <option value="">Select an option</option>
                <option value="economy">Economy</option>
                <option value="security">Security</option>
                <option value="education">Education</option>
                <option value="infrastructure">Infrastructure</option>
            </select>
        </div>

        <button type="submit">Submit Survey</button>
    </form>

    <div id="confirmation" style="margin-top: 20px; color: green;"></div>

    <script>
        document.getElementById('surveyForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Gather submitted data
            const formData = {
                fullName: document.getElementById('fullName').value,
                state: document.getElementById('state').value,
                priority: document.getElementById('priority').value,
                timestamp: new Date().toISOString()
            };

            // Process data (e.g., log to console or display confirmation)
            console.log('Survey Submitted:', formData);
            document.getElementById('confirmation').textContent = 'Thank you for participating in the survey.';
            this.reset();
        });
    </script>

</body>
</html>
